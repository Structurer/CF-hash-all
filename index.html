<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地哈希计算工具</title>
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <!-- 引入样式 -->
    <link rel="stylesheet" href="./style.css">
    <!-- 引入CryptoJS -->
    <script src="./crypto-js.min.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="title">本地哈希计算工具（文本实时计算 | 文件拖拽计算）</h2>
        <div class="row-box">
            <div class="col-box">
                <div class="section">
                    <h3>一、 文本哈希输入（实时计算，输入即更）</h3>
                    <textarea id="textInput" placeholder="输入/修改文字实时计算哈希，左列实时更新覆盖旧结果..."></textarea>
                </div>
            </div>
            <div class="col-box">
                <div class="section">
                    <h3>二、 拖拽文件/文件夹（自动累加，拖拽即算）</h3>
                    <div id="dragArea" class="drag-area">
                        <p>🖱️ 拖拽文件/文件夹至此</p>
                        <p>多批次拖拽累加 | 递归子文件夹 | 右列顺序排列不打乱</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="section">
            <h3>三、 选择哈希算法（全局通用，可多选）</h3>
            <div class="algo-wrap">
                <div class="algo-group"><label class="algo-item"><input type="checkbox" name="algo" value="MD5" checked> MD5</label></div>
                <div class="algo-group"><label class="algo-item"><input type="checkbox" name="algo" value="SHA-1"> SHA-1</label></div>
                <div class="algo-group">
                    <label class="algo-item"><input type="checkbox" name="algo" value="SHA-256" checked> SHA-256</label>
                    <label class="algo-item"><input type="checkbox" name="algo" value="SHA-384"> SHA-384</label>
                    <label class="algo-item"><input type="checkbox" name="algo" value="SHA-512" checked> SHA-512</label>
                </div>
                <div class="algo-group">
                    <label class="algo-item"><input type="checkbox" name="algo" value="SHA-3-224"> SHA3-224</label>
                    <label class="algo-item"><input type="checkbox" name="algo" value="SHA-3-256"> SHA3-256</label>
                    <label class="algo-item"><input type="checkbox" name="algo" value="SHA-3-384"> SHA3-384</label>
                    <label class="algo-item"><input type="checkbox" name="algo" value="SHA-3-512"> SHA3-512</label>
                </div>
                <div class="algo-group"><label class="algo-item"><input type="checkbox" name="algo" value="RIPEMD-160"> RIPEMD-160</label></div>
            </div>
        </div>
        <div class="btn-group">
            <button id="copyAllBtn" class="copy">复制全部结果</button>
            <button id="clearAllBtn" class="clear">清空所有内容</button>
        </div>
        <div class="loading" id="loading">计算中... 大文件/多文件请稍候</div>
        <div class="row-box">
            <div class="col-box">
                <div class="section">
                    <h3>四、 文本哈希结果（实时覆盖，仅当前文本）</h3>
                    <textarea id="textResult" class="result-box" readonly placeholder="文本哈希结果将实时展示在这里..."></textarea>
                </div>
            </div>
            <div class="col-box">
                <div class="section">
                    <h3>五、 文件哈希结果（拖拽累加，顺序排列）</h3>
                    <textarea id="fileResult" class="result-box" readonly placeholder="文件哈希结果将按拖拽顺序累加展示在这里..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="custom-tip" id="customTip"></div>

    <!-- 引入外部JS，放body末尾保证DOM加载完成 -->
    <script src="./hash.js"></script>
</body>
</html>
