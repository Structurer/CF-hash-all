<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="本地哈希计算工具，支持文本实时计算和文件拖拽计算，支持MD5、SHA-1、SHA-256、SHA-512等多种哈希算法">
    <title>本地哈希计算工具</title>
    <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./crypto-js.min.js"></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1 class="title">本地哈希计算工具</h1>
        </header>

        <section class="section algo-section">
            <h2 class="section-title">哈希算法选择</h2>
            <div class="algo-wrap" aria-label="哈希算法选择">
                <div class="algo-group">
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="MD5" checked>
                        <span>MD5</span>
                    </label>
                </div>
                <div class="algo-group">
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-1">
                        <span>SHA-1</span>
                    </label>
                </div>
                <div class="algo-group">
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-256" checked>
                        <span>SHA-256</span>
                    </label>
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-384">
                        <span>SHA-384</span>
                    </label>
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-512" checked>
                        <span>SHA-512</span>
                    </label>
                </div>
                <div class="algo-group">
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-3-224">
                        <span>SHA3-224</span>
                    </label>
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-3-256">
                        <span>SHA3-256</span>
                    </label>
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-3-384">
                        <span>SHA3-384</span>
                    </label>
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="SHA-3-512">
                        <span>SHA3-512</span>
                    </label>
                </div>
                <div class="algo-group">
                    <label class="algo-item">
                        <input type="checkbox" name="algo" value="RIPEMD-160">
                        <span>RIPEMD-160</span>
                    </label>
                </div>
            </div>
        </section>

        <div class="main-content">
            <section class="section">
                <h2 class="section-title">输入区域</h2>
                <div class="input-wrapper">
                    <textarea 
                        id="textInput" 
                        class="dual-input"
                        placeholder="输入文本或拖拽文件..."
                        aria-label="文本输入与文件拖拽区域"
                    ></textarea>
                    <div id="fileIndicator" class="file-indicator" aria-hidden="true">
                        <span class="cursor"></span>
                        <div class="file-icon">📄</div>
                        <div class="file-info">
                            <span class="file-count-text">0 个文件</span>
                            <span class="file-hint">按任意键输入文字</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="result-header-row">
                    <h2 class="section-title">哈希结果</h2>
                    <button id="clearAllBtn" class="clear-inline" aria-label="清空所有内容">
                        <span>🗑️</span> 清空
                    </button>
                </div>
                <div 
                    id="combinedResult" 
                    class="result-container"
                    aria-label="哈希结果"
                >
                    <div class="empty-tip">请输入文本或拖拽文件</div>
                </div>
            </section>
        </div>

        <div class="action-bar">
            <div class="loading" id="loading" role="status" aria-label="计算中">
                <span>⏳</span> 计算中...
            </div>
        </div>

        <footer class="footer">
            <p>数据仅在本地计算，不会上传至服务器</p>
        </footer>
    </main>

    <div class="custom-tip" id="customTip" role="status" aria-live="polite"></div>

    <script src="./hash.js"></script>
</body>
</html>
